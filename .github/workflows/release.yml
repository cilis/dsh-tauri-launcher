# 打 v* tag 时自动构建 Windows 桌面应用并发布 GitHub Release，
# 并同步创建/更新 Gitee 镜像仓库的同名发行版（需配置 GITEE_TOKEN secret）。
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo 注册表
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri

      - name: 运行回归测试
        run: cargo test
        working-directory: launcher/src-tauri

      - name: 构建 release exe
        run: cargo build --release
        working-directory: launcher/src-tauri

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: launcher/src-tauri/target/release/dsh-launcher.exe
          generate_release_notes: true

      # Gitee 镜像同步只携带 git 内容，发行版（Release）需经 API 单独创建。
      # 未配置 GITEE_TOKEN 时本步骤告警后跳过，不影响 GitHub 发布。
      # 注意：secrets 上下文不能用于 step 的 if 条件，故在 run 内判断 env。
      - name: 同步发行版到 Gitee
        shell: pwsh
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if (-not $env:GITEE_TOKEN) {
            Write-Warning "未配置 GITEE_TOKEN secret（仓库 Settings -> Secrets -> Actions），跳过 Gitee 发行版同步。"
            exit 0
          }
          $base = 'https://gitee.com/api/v5/repos/cilis/dsh-tauri-launcher'
          $headers = @{ 'User-Agent' = 'dsh-release-sync' }
          $exe = 'launcher/src-tauri/target/release/dsh-launcher.exe'

          # 1) Gitee 侧必须已同步该 tag（用户手动“强制同步”），否则跳过并告警。
          $tags = (Invoke-RestMethod -Uri "$base/tags" -Headers $headers -TimeoutSec 30).name
          if ($tags -notcontains $env:TAG) {
            Write-Warning "Gitee 尚未同步 tag $env:TAG，请先在 Gitee 执行“强制同步”后重跑本工作流或手动补建发行版。"
            exit 0
          }

          # 2) 已存在同名发行版则更新，否则创建。
          $rel = $null
          try {
            $rel = Invoke-RestMethod -Uri "$base/releases/tags/$env:TAG" -Headers $headers -TimeoutSec 30
          } catch {
            if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw }
          }
          $body = "DeepSeek Harness 桌面启动器 $env:TAG（自动同步自 GitHub Release）"
          if ($rel) {
            $patch = @{ access_token = $env:GITEE_TOKEN; name = $env:TAG; body = $body } | ConvertTo-Json
            $rel = Invoke-RestMethod -Method Patch -Uri "$base/releases/$($rel.id)" -Body $patch -ContentType 'application/json' -Headers $headers -TimeoutSec 30
            Write-Host "已更新 Gitee 发行版 $env:TAG (id=$($rel.id))"
          } else {
            $create = @{
              access_token     = $env:GITEE_TOKEN
              tag_name         = $env:TAG
              name             = $env:TAG
              body             = $body
              target_commitish = $env:TAG
            } | ConvertTo-Json
            $rel = Invoke-RestMethod -Method Post -Uri "$base/releases" -Body $create -ContentType 'application/json' -Headers $headers -TimeoutSec 30
            Write-Host "已创建 Gitee 发行版 $env:TAG (id=$($rel.id))"
          }

          # 3) 上传 exe 附件（已存在同名附件则跳过）。
          #    注意：attach_files 无附件时可能返回 null，需强制数组化再取 name，
          #    避免 $null.name 抛错导致“发行版已建但附件未传”的假失败。
          $names = @()
          try {
            $resp = Invoke-RestMethod -Uri "$base/releases/$($rel.id)/attach_files" -Headers $headers -TimeoutSec 30
            if ($resp) { foreach ($a in @($resp)) { $names += $a.name } }
          } catch { Write-Host "查询附件列表失败（忽略）: $($_.Exception.Message)" }
          if ($names -contains 'dsh-launcher.exe') {
            Write-Host "附件 dsh-launcher.exe 已存在，跳过上传。"
          } else {
            try {
              $form = @{ access_token = $env:GITEE_TOKEN; file = Get-Item $exe }
              Invoke-RestMethod -Method Post -Uri "$base/releases/$($rel.id)/attach_files" -Form $form -Headers $headers -TimeoutSec 180 | Out-Null
              Write-Host "附件 dsh-launcher.exe 已上传。"
            } catch {
              # 上传成功但响应解析失败时，二次查询确认，避免误报失败。
              Write-Host "上传调用异常（可能已成功）: $($_.Exception.Message)"
              $confirm = @()
              try {
                $r2 = Invoke-RestMethod -Uri "$base/releases/$($rel.id)/attach_files" -Headers $headers -TimeoutSec 30
                if ($r2) { foreach ($a in @($r2)) { $confirm += $a.name } }
              } catch {}
              if ($confirm -contains 'dsh-launcher.exe') {
                Write-Host "二次确认：附件已上传成功。"
              } else {
                throw
              }
            }
          }
