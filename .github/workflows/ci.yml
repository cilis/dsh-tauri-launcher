# 分支/PR 验证流水线：新改动先在分支上验证（回归测试 + release 构建 +
# exe 产物下载），绿灯后才经 PR 合入 main；push 到任何分支即触发，
# 不必等 PR 建好；main 上的合并提交也会再跑一次兜底。
# 产物用于人工冒烟验证：PR 页面底部 Artifacts 可下载 dsh-launcher.exe。
name: ci

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 工作流的 YAML 合法 ≠ GitHub 接受：2026-10-26 那次在 job 级 env 里用了 `runner`
      # 上下文，PyYAML 完全通过，GitHub 却把整份 release.yml 判为无效——推送后只留下
      # 一条 0 个 job 的失败 run。actionlint 按 GitHub 的上下文规则校验，能在 PR 阶段拦住。
      - name: 校验 GitHub Actions 工作流（actionlint）
        shell: pwsh
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          $url = "https://github.com/rhysd/actionlint/releases/download/v$env:ACTIONLINT_VERSION/actionlint_$($env:ACTIONLINT_VERSION)_windows_amd64.zip"
          $zip = Join-Path $env:RUNNER_TEMP 'actionlint.zip'
          # 单次下载偶发超时会让整条流水线变红，重试三次再判失败。
          for ($i = 1; $i -le 3; $i++) {
            try { Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing -TimeoutSec 120; break }
            catch { if ($i -eq 3) { throw }; Write-Host "下载失败（第 $i 次）：$($_.Exception.Message)，重试…"; Start-Sleep -Seconds 5 }
          }
          Expand-Archive -Path $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'actionlint') -Force
          $exe = Join-Path $env:RUNNER_TEMP 'actionlint/actionlint.exe'
          # 不带文件参数：actionlint 会自己找最近的 .github/workflows。
          & $exe -no-color
          if ($LASTEXITCODE -ne 0) { throw "actionlint 发现工作流问题（见上方输出）。" }
          Write-Host '工作流校验通过。'

      # 发版说明的唯一来源是 CHANGELOG.md，release 工作流打 tag 时缺小节会直接失败。
      # 这里把「改了版本号却没写说明」提前拦在 PR 阶段，并在同一处校验中英双语格式。
      - name: 校验 CHANGELOG.md 覆盖当前版本号
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw -Encoding UTF8).Trim() | ConvertFrom-Json | Select-Object -ExpandProperty version
          & ./.github/scripts/release-notes.ps1 -Tag "v$version" -DryRun | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "package.json 版本为 $version，但 CHANGELOG.md 没有对应的合格小节。请先用 docs: 提交补一节发版说明（格式见 docs/release.md，需含 <!-- en --> 英文段），再做版本同步提交。"
          }
          Write-Host "CHANGELOG.md 已包含 v$version 的合格小节。"

      - name: Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo 注册表
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri

      - name: 运行回归测试
        run: cargo test
        working-directory: launcher/src-tauri

      - name: JS 语法检查（宿主/浏览器半 + 桌面 UI）
        run: |
          node --check lib/index.js
          node --check lib/client.js
          node --check launcher/ui/main.js
          node --check launcher/ui/settings.js
          node --check launcher/ui/exiting.js

      - name: 构建 release exe
        run: cargo build --release
        working-directory: launcher/src-tauri

      - name: 上传 exe 产物（供 PR 冒烟验证）
        uses: actions/upload-artifact@v4
        with:
          name: dsh-launcher-win-x64
          path: launcher/src-tauri/target/release/dsh-launcher.exe
          retention-days: 7
          if-no-files-found: error
