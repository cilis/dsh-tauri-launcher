# 分支/PR 验证流水线：新改动先在分支上验证（回归测试 + release 构建 +
# exe 产物下载），绿灯后才经 PR 合入 main；push 到任何分支即触发，
# 不必等 PR 建好；main 上的合并提交也会再跑一次兜底。
# 产物用于人工冒烟验证：PR 页面底部 Artifacts 可下载 dsh-launcher.exe。
name: ci

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 发版说明的唯一来源是 CHANGELOG.md，release 工作流打 tag 时缺小节会直接失败。
      # 这里把「改了版本号却没写说明」提前拦在 PR 阶段，并在同一处校验中英双语格式。
      - name: 校验 CHANGELOG.md 覆盖当前版本号
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw -Encoding UTF8).Trim() | ConvertFrom-Json | Select-Object -ExpandProperty version
          & ./.github/scripts/release-notes.ps1 -Tag "v$version" -DryRun | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "package.json 版本为 $version，但 CHANGELOG.md 没有对应的合格小节。请先用 docs: 提交补一节发版说明（格式见 docs/release.md，需含 <!-- en --> 英文段），再做版本同步提交。"
          }
          Write-Host "CHANGELOG.md 已包含 v$version 的合格小节。"

      - name: Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo 注册表
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri

      - name: 运行回归测试
        run: cargo test
        working-directory: launcher/src-tauri

      - name: JS 语法检查（宿主/浏览器半 + 桌面 UI）
        run: |
          node --check lib/index.js
          node --check lib/client.js
          node --check launcher/ui/main.js
          node --check launcher/ui/settings.js
          node --check launcher/ui/exiting.js

      - name: 构建 release exe
        run: cargo build --release
        working-directory: launcher/src-tauri

      - name: 上传 exe 产物（供 PR 冒烟验证）
        uses: actions/upload-artifact@v4
        with:
          name: dsh-launcher-win-x64
          path: launcher/src-tauri/target/release/dsh-launcher.exe
          retention-days: 7
          if-no-files-found: error
