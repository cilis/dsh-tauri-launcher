[package]
name = "dsh-launcher"
version = "1.0.7"
description = "DeepSeek Harness 桌面启动器：自动检测/安装并启动本地 DeepSeek Harness，系统托盘管理退出"
authors = ["lenorin"]
edition = "2021"

[lib]
name = "dsh_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "net", "sync"] }

# 与 tauri/tao 同版本（类型互通：HWND 直接传递），仅用于任务栏大图标（ICON_BIG）设置
[target."cfg(windows)".dependencies.windows]
version = "0.61"
features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"]
