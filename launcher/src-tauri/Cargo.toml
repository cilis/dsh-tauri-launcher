[package]
name = "dsh-launcher"
version = "1.1.2"
description = "DeepSeek Harness 桌面启动器：自动检测/安装并启动本地 DeepSeek Harness，系统托盘管理退出"
authors = ["lenorin"]
edition = "2021"

[lib]
name = "dsh_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
# 日志落盘（roadmap v1.2 W10）：官方插件提供 log facade 与按大小轮转的文件 target。
# 首次构建需要联网拉取 tauri-plugin-log 与 fern（本机离线缓存里没有）。
tauri-plugin-log = "2"
# log facade：各处诊断输出改用 log::warn!/error!，由插件统一送往 stdout 与日志文件。
# 版本已在 Cargo.lock 的传递依赖里，不引入新下载。
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 更新检查的版本比较：需要区分正式版与预发布（1.1.0-rc.1 < 1.1.0），字符串比较做不到
semver = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "net", "sync"] }

# 与 tauri/tao 同版本（类型互通：HWND 直接传递），用于任务栏大图标（ICON_BIG）、
# 窗口类图标槽与显式 AppUserModelID（Win32_UI_Shell）
[target."cfg(windows)".dependencies.windows]
version = "0.61"
features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"]
