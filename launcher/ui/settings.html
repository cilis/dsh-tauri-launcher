<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>设置</title>
    <link rel="stylesheet" href="./vars.css" />
    <link rel="stylesheet" href="./settings.css" />
    <script src="./settings.js" defer></script>
  </head>
  <!-- 无边框窗口：body/main/h1 挂 drag-region 作为不可见拖动热区，
       仅命中带属性的元素本身，开关/按钮等子元素交互不受影响 -->
  <body data-tauri-drag-region>
    <main class="settings" data-tauri-drag-region>
      <h1 data-tauri-drag-region>设置</h1>

      <section class="row">
        <div class="info">
          <div class="label">开机启动</div>
          <!-- <div class="desc">登录 Windows 后自动启动桌面应用</div> -->
        </div>
        <label class="switch">
          <input type="checkbox" id="toggle-autostart" />
          <span class="slider"></span>
        </label>
      </section>

      <section class="row">
        <div class="info">
          <div class="label">创建全局快捷方式</div>
          <div class="desc">
            注册全局快捷键 <kbd id="hotkey-label">Ctrl+Shift+H</kbd>，可唤起 DeepSeek
            Harness。
          </div>
        </div>
        <label class="switch">
          <input type="checkbox" id="toggle-shortcut" />
          <span class="slider"></span>
        </label>
      </section>

      <section class="row">
        <div class="info">
          <div class="label">桌面快捷方式</div>
          <div class="desc">
            在桌面创建 DeepSeek Harness 快捷方式图标
          </div>
        </div>
        <label class="switch">
          <input type="checkbox" id="toggle-desktop" />
          <span class="slider"></span>
        </label>
      </section>

      <section class="row">
        <div class="info">
          <div class="label">退出时结束 DeepSeek Harness 进程</div>
          <div class="desc">
            勾选后，退出桌面应用时一并结束 DeepSeek Harness 进程
          </div>
        </div>
        <label class="switch">
          <input type="checkbox" id="toggle-terminate" />
          <span class="slider"></span>
        </label>
      </section>

      <section class="row">
        <div class="info">
          <div class="label">写入日志文件</div>
          <div class="desc">
            把启动过程与 DeepSeek Harness 的输出写入日志文件，报障时便于取证
          </div>
        </div>
        <label class="switch">
          <input type="checkbox" id="toggle-logging" />
          <span class="slider"></span>
        </label>
      </section>

      <section class="row">
        <div class="info">
          <div class="label">日志位置</div>
          <div class="desc log-path" id="log-path">读取中…</div>
          <div class="desc" id="log-meta"></div>
        </div>
        <button id="open-log-btn" type="button">打开目录</button>
      </section>

      <p class="status" id="status"></p>

      <button id="close-btn">关闭</button>
    </main>
  </body>
</html>
